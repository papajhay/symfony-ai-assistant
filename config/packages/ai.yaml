ai:
    platform:
        ollama:
            endpoint: '%env(OLLAMA_HOST_URL)%'
    agent:
        default:
            platform: 'ai.platform.ollama'
            model: 'llama3.2:3b'
            prompt:
                file: '%kernel.project_dir%/prompts/assistant.txt'
            tools:
                services:
                    - 'Symfony\AI\Agent\Bridge\SimilaritySearch\SimilaritySearch'
    store:
        memory:
            symfony_docs:
                strategy: 'cosine'
    vectorizer:
        symfony_docs:
            platform: 'ai.platform.ollama'
            model: 'nomic-embed-text'
    indexer:
        symfony_docs:
            source: '%kernel.project_dir%/data/docs'
            loader: 'ai.loader.docs'
            vectorizer: 'ai.vectorizer.symfony_docs'
            store: 'ai.store.memory.symfony_docs'
    retriever:
        symfony_docs:
            vectorizer: 'ai.vectorizer.symfony_docs'
            store: 'ai.store.memory.symfony_docs'
