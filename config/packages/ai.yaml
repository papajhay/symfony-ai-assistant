ai:
    # see https://symfony.com/doc/current/ai/components/platform.html
    platform:
    # fournisseur IA local
        ollama:
            endpoint: '%env(OLLAMA_HOST_URL)%' # Adresse du serveur Ollama

    # see https://symfony.com/doc/current/ai/bundles/ai-bundle.html
    agent:  
        default:
            # Plateforme utilisée par l'agent
            platform: 'ai.platform.ollama'
            model: 'llama3.2:3b'
            prompt:
                text: 'Tu es un assistant pédagogique. Tu réponds toujours en français et tu expliques les concepts simplement aux débutants.'

    # see https://symfony.com/doc/current/ai/components/store.html
    store:
